<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invitación Digital de XV Años 🌸</title>
    <meta name="description" content="Invitación digital interactiva de XV Años: cuenta regresiva, ubicación, itinerario, galería de fotos y confirmación de asistencia, todo en un solo enlace." />

    <!-- Open Graph / vista previa al compartir el link (WhatsApp, Telegram, iMessage, etc.).
         Estas etiquetas son estáticas a propósito: los bots de vista previa no ejecutan
         JavaScript, así que no pueden leer el <title> dinámico que la app pone en tiempo real
         para cada invitación (ver generarHTMLFinal en templates.ts). Por eso esta tarjeta es
         genérica para cualquier invitación, no personalizada por cliente. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="🌸 Invitación Digital de XV Años" />
    <meta property="og:description" content="Toca para ver la invitación interactiva: fecha, ubicación, itinerario y más." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="🌸 Invitación Digital de XV Años" />
    <meta name="twitter:description" content="Toca para ver la invitación interactiva: fecha, ubicación, itinerario y más." />
  </head>
  <body>
    <div id="root">
      <!--
        Placeholder estático (sin JS) que se ve mientras se descarga/ejecuta el bundle de la
        app. React lo reemplaza automáticamente en cuanto monta, así que la pantalla nunca se
        ve completamente en blanco durante la primera carga.
      -->
      <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:#faf9f7; font-family:system-ui,-apple-system,sans-serif;">
        <div style="display:flex; flex-direction:column; align-items:center; gap:12px;">
          <div style="width:32px; height:32px; border-radius:50%; border:3px solid #e5e1da; border-top-color:#8a7a5c; animation:spin 0.8s linear infinite;"></div>
          <span style="font-size:13px; color:#8a8578;">Cargando invitación…</span>
        </div>
      </div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
